name: markdownlint

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

# No `paths:` filter, for the same reason as ci.yml — a required status check
# that is skipped can never report, and the pull request waits forever.

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
